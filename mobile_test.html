<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile Emulation</title>
    <style>
        body { background: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .phone {
            width: 375px; /* Exact width of iPhone 12/13/11 Pro Max scaled down etc, standard 6 inch mobile */
            height: 812px;
            border: 16px solid black;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            background: white;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="phone">
        <iframe src="index.html"></iframe>
    </div>
</body>
</html>
