<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | US Architects</title>
    <meta name="description" content="The page you are looking for does not exist. Return to US Architects home page.">
    <meta name="author" content="Rushikesh Pattiwar">
    <meta name="developer" content="pattiwarrushikesh5102@gmail.com">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg">

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/main.css?v=2">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3XBVGJZCDE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-3XBVGJZCDE');
    </script>

    <style>
        .error-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* Abstract Architectural Background */
        .bg-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('./assets/images/modern_apartment_hero.png') center/cover;
            opacity: 0.15;
            z-index: 0;
            filter: grayscale(100%) contrast(1.2);
        }

        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--bg-primary) 0%, transparent 100%);
            z-index: 1;
        }

        /* Giant 404 Watermark */
        .error-code-bg {
            font-family: var(--font-heading);
            font-size: clamp(12rem, 35vw, 25rem);
            font-weight: 800;
            line-height: 1;
            color: var(--text-primary);
            opacity: 0.03;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 2;
        }

        /* Glassmorphism Container */
        .error-container {
            z-index: 10;
            max-width: 600px;
            padding: 50px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--nav-border);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transform-style: preserve-3d;
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: var(--text-4xl);
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            transform: translateZ(30px);
        }

        .error-description {
            font-size: var(--text-lg);
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.6;
            transform: translateZ(20px);
        }

        .error-actions {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            transform: translateZ(40px);
        }

        .cta-button {
            padding: 15px 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .secondary-btn {
            background: transparent;
            border: 2px solid var(--text-primary);
            color: var(--text-primary);
        }
        .secondary-btn:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .footer-credit {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            opacity: 0.5;
            font-size: 0.8rem;
            color: var(--text-primary);
        }

        /* Top Bar for Theme Toggle */
        .top-bar {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 30px 20px;
                margin: 0 20px;
            }
            .error-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <div class="error-page">
        <!-- Background Layers -->
        <div class="bg-canvas"></div>
        <div class="bg-overlay"></div>
        <div class="error-code-bg">404</div>

        <!-- Foreground Glass Container -->
        <div class="error-container">
            <h1 class="error-title">Dimensional Error</h1>
            <p class="error-description">
                The coordinates you requested do not exist within our current architectural framework. The page may have been relocated or exists in a parallel design phase.
            </p>
            <div class="error-actions">
                <a href="index.html" class="cta-button">Return to Studio</a>
                <a href="index.html#projects" class="cta-button secondary-btn">View Projects</a>
            </div>
        </div>

        <div class="footer-credit">
            &copy; 2025 US Architects | Developed by Atharva Kulkarni
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script src="./assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof VanillaTilt !== 'undefined') {
                VanillaTilt.init(document.querySelector(".error-container"), {
                    max: 8,
                    speed: 400,
                    glare: true,
                    "max-glare": 0.2,
                });
            }
        });
    </script>
</body>

</html>
